# tags 無し slide の自動レイアウト確認用
- - heading: 1 pane / 1 行
  - 行が 1 つなら中央に大きく出す
- - heading: 1 pane / 箇条書き
  - 1 行目
  - 2 行目は **強調** と `code` を含む
  - list: |
      list block の行も
      同じ箇条書きに入る
- - heading: 2 panes / テキスト + 画像
  - 左にテキスト
  - 右に画像
  - image: { src: ./sample.svg, $text: 画像(アスペクト比維持) }
- - heading: 3 panes / ト型
  - 左にテキスト
  - 右上にコード、右下に画像
  - code:
      lang: java
      $text: |
        public class Slide {
          private String heading;

          public void setHeading(String value) {
            this.heading = value.trim();
          }
        }
  - image: { src: ./sample.svg }
- - heading: 4 panes / 十字
  - テキスト
  - code: { lang: ts, $text: "const [heading, rest] = pick(slide.items, [\"heading\"]);" }
  - image: { src: ./sample.svg }
  - video: { url: https://www.youtube.com/watch?v=dQw4w9WgXcQ, $text: YouTube の埋め込み }
- - heading: 5 panes / 左 2 + 右 3
  - テキスト
  - code: { lang: java, $text: "System.out.println(\"a\");" }
  - image: { src: ./sample.svg }
  - code: { lang: java, $text: "System.out.println(\"b\");" }
  - image: { src: ./sample.svg }
- - heading: 8 panes / 4 + 4
  - テキスト
  - code: { lang: java, $text: "a();" }
  - code: { lang: java, $text: "b();" }
  - code: { lang: java, $text: "c();" }
  - image: { src: ./sample.svg }
  - image: { src: ./sample.svg }
  - image: { src: ./sample.svg }
  - code: { lang: java, $text: "d();" }
- - code:
      lang: java
      $text: |
        // 1 pane に長いコード。pane に収まるようにフォントサイズが下がる
        package com.example.deck.search;

        import java.util.Date;

        public class DeckSearchCondition {
          private Date from;
          private Date to;
          private String speaker;
          private String event;
          private String keyword;

          public void setFrom(String from) { this.from = DateUtil.parse(from); }
          public void setTo(String to) { this.to = DateUtil.parse(to); }
          public boolean hasPeriod() { return from != null && to != null; }
          public boolean isEmpty() { return from == null && to == null && speaker == null && event == null && keyword == null; }
        }
