- description: flow block の確認
  $items:
  - heading: flow / 左から右(吹き出し番号)
  - flow:
      direction: row
      focus: [2, 3, 4]
      steps:
        - { label: 原稿 }
        - { label: 構成, via: 組み立て, phase: ① 考えるとき, detail: 伝えたいことと前提を決める }
        - { label: スライド, via: YAML, phase: ② 書くとき, detail: 内容だけを data に書く }
        - { label: 発表, phase: ③ 見せるとき, detail: 発表者モードで話す }
